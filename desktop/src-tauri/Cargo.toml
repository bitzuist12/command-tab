[package]
name = "command-tab-wa"
version = "0.1.0"
edition = "2021"
description = "Command Tab WhatsApp desktop app"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
strip = true
lto = true
